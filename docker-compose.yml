services:
  bot:
    build: .
    container_name: ai_challenge_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-ai_challenge}
      - POSTGRES_USER=${POSTGRES_USER:-ai_challenge_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ai_challenge_user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ai_challenge}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - ai_challenge_net

  postgres:
    image: postgres:16-alpine
    container_name: ai_challenge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_challenge}
      POSTGRES_USER: ${POSTGRES_USER:-ai_challenge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_challenge_user} -d ${POSTGRES_DB:-ai_challenge}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_challenge_net

  redis:
    image: redis:7-alpine
    container_name: ai_challenge_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_challenge_net

volumes:
  pgdata:
  redisdata:

networks:
  ai_challenge_net:
    driver: bridge
