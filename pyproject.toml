[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-challenge-bot"
version = "1.0.0"
description = "AI Challenge — интерактивный Telegram-бот «AI VS Молодёжь»"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.13.1",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "pydantic-settings==2.6.1",
    "pydantic==2.9.2",
    "redis==5.2.0",
    "aiosqlite>=0.20.0",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "APScheduler==3.10.4",
    "greenlet==3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "factory-boy==3.3.1",
    "aiosqlite==0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "ARG", "SIM"]
ignore = ["E501", "B008", "A003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
